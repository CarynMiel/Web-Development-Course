<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Documentation</title>
</head>
<body>
    <h1>HTML Documentation</h1>

    <table>
        <tr>
            <th>Element name</th>
            <th>Element tag</th>
            <th>Closing tag?</th>
            <th>Additional attributes</th>
        </tr>
        <tr>
            <td>Table</td>
            <td>&lt;table&gt;&lt;/table&gt;</td>
            <td>YES</td>
            <td>align, bgcolor, border, cellpadding, cellspacing, frame, rules, summary, width</td>
        </tr>
        <tr>
            <td>Paragraph</td>
            <td>&lt;p&gt;&lt;/p&gt;</td>
            <td>YES</td>
        </tr>
        <tr>
            <td>Line Break</td>
            <td>&lt;br&gt;</td>
            <td>NO</td>
        </tr>
        
    </table>

</body>
</html>
